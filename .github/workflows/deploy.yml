name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Satu deploy pada satu waktu, dan jangan batalkan yang sedang jalan:
# rsync yang terpotong di tengah meninggalkan server dalam keadaan setengah jadi.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: /home/u713441903/domains/j-corp.id/public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # Vendor dibangun di sini, bukan di server: proc_open termasuk
      # disable_functions di shared hosting, jadi composer mustahil jalan di sana.
      - name: Build PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # Kunci dikirim sebagai base64 satu baris, bukan PEM multi-baris.
      # Secret multi-baris gampang rusak tanpa jejak - spasi tersembunyi, CRLF
      # dari paste lewat browser, atau baris akhir yang hilang - dan semuanya
      # muncul sebagai "error in libcrypto" yang tidak menunjuk ke penyebabnya.
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Gagal di sini dengan pesan yang jelas, bukan di tengah rsync.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY_B64 tidak menghasilkan kunci yang valid setelah di-decode."
            echo "Perbarui secret itu dengan keluaran: base64 < id_ed25519 | tr -d '\\n'"
            exit 1
          fi
          echo "Kunci SSH valid."

      - name: Upload build to server
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='public/storage' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_PATH/"

      - name: Run post-deploy tasks
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" < deploy/remote-deploy.sh

      - name: Verify site responds
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://j-corp.id/ || echo 000)
          echo "HTTP $code"
          test "$code" = "200"
